<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Call recording — Pete Grosso Team</title>
<meta property="og:title" content="Call recording — Pete Grosso Team">
<meta property="og:description" content="Tap to listen — caller, summary, and full audio on one page.">
<meta property="og:image" content="https://pocketpete-grit.github.io/listing-manager/og-play.png">
<meta property="og:url" content="https://pocketpete-grit.github.io/listing-manager/play.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pocketpete-grit.github.io/listing-manager/og-play.png">
<link rel="icon" type="image/svg+xml" href="play-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: { black:'#0a0a0a', white:'#ffffff', cream:'#f8f6f2', warmgray:'#e8e4dd', gold:'#b8986e', goldlight:'#d4bc96', charcoal:'#2a2a2a', textgray:'#4a4a4a' } },
  fontFamily: { sans:['Outfit','sans-serif'], serif:['Cormorant Garamond','serif'] }
}}};
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{font-family:'Outfit',sans-serif}
.player{display:flex;align-items:center;gap:1rem;margin-top:1.4rem;border:1px solid #e8e4dd;background:#f8f6f2;padding:1rem 1.1rem}
.playbtn{width:52px;height:52px;flex:none;border:0;border-radius:0;background:#0a0a0a;color:#b8986e;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s,color .3s}
.playbtn:hover{background:#b8986e;color:#0a0a0a}
.playbtn:active{transform:scale(.98)}
.ptrack{flex:1;height:3px;background:#e8e4dd;cursor:pointer}
.pfill{height:100%;width:0;background:#b8986e;transition:width .15s linear}
.ptime{font-size:12px;letter-spacing:.08em;color:#4a4a4a;font-variant-numeric:tabular-nums;flex:none}
</style>
</head>
<body class="bg-brand-cream text-brand-charcoal font-sans antialiased">

<div class="relative bg-brand-black overflow-hidden" style="border-bottom:2px solid #B8986E">
  <div class="pointer-events-none absolute inset-0" style="background: radial-gradient(ellipse at 30% 70%, rgba(184,152,110,0.15) 0%, transparent 50%)"></div>
  <div class="pointer-events-none absolute inset-0" style="background: radial-gradient(ellipse at 85% 10%, rgba(184,152,110,0.12) 0%, transparent 45%)"></div>
  <div class="relative max-w-[620px] mx-auto px-5 pt-12 pb-10">
    <div class="flex items-center gap-3 mb-4">
      <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-brand-gold">Pete Grosso Team · AI Receptionist</span>
      <span class="h-px w-10 bg-brand-gold"></span>
    </div>
    <h1 class="font-serif text-5xl text-brand-white leading-tight">Call <em class="text-brand-gold">Recording.</em></h1>
  </div>
</div>

<div class="max-w-[620px] mx-auto px-5 py-8">
  <div id="out" class="bg-brand-white border border-brand-warmgray shadow-sm rounded-none p-8">
    <div class="text-center text-brand-textgray py-10" id="loading">Loading…</div>
  </div>
  <div class="mt-8 flex items-center justify-between text-[10px] font-bold uppercase tracking-[0.25em] text-brand-textgray/70">
    <span>Shared by the team</span>
    <span>RE/MAX Integrity Leaders</span>
  </div>
</div>

<script>
"use strict";
const API_URL = "https://wxntrwlalvhwsueqbiys.supabase.co/functions/v1/listing-admin";
const id = new URLSearchParams(location.search).get("c") || "";

function icons(){ if (window.lucide) lucide.createIcons(); }
function fmtWhen(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) + " " +
         d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}
function fmtDur(s){ if(!s) return ""; return ` · ${Math.floor(s/60)}m ${s%60}s`; }
function fmtClock(s){ s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function buildPlayer(url, durationSec){
  const wrap = document.createElement("div"); wrap.className = "player";
  const btn = document.createElement("button"); btn.className = "playbtn"; btn.setAttribute("aria-label","Play recording");
  btn.innerHTML = '<i data-lucide="play" class="h-5 w-5"></i>';
  const track = document.createElement("div"); track.className = "ptrack";
  const fill = document.createElement("div"); fill.className = "pfill"; track.appendChild(fill);
  const time = document.createElement("span"); time.className = "ptime";
  time.textContent = "0:00 / " + fmtClock(durationSec);
  const au = new Audio(); au.preload = "metadata"; au.src = url;
  const setBtn = (playing) => {
    btn.innerHTML = playing ? '<i data-lucide="pause" class="h-5 w-5"></i>' : '<i data-lucide="play" class="h-5 w-5"></i>';
    icons();
  };
  btn.onclick = () => { if (au.paused) au.play(); else au.pause(); };
  au.onplay = () => setBtn(true);
  au.onpause = () => setBtn(false);
  au.onended = () => { setBtn(false); fill.style.width = "0"; au.currentTime = 0; };
  au.ontimeupdate = () => {
    const total = au.duration || durationSec || 0;
    if (total) fill.style.width = (au.currentTime / total * 100) + "%";
    time.textContent = fmtClock(au.currentTime) + " / " + fmtClock(au.duration || durationSec);
  };
  track.onclick = (e) => {
    const total = au.duration || durationSec || 0;
    if (!total) return;
    const r = track.getBoundingClientRect();
    au.currentTime = ((e.clientX - r.left) / r.width) * total;
    if (au.paused) au.play();
  };
  wrap.append(btn, track, time);
  return wrap;
}

async function boot(){
  const out = document.getElementById("out");
  const fail = (t)=>{ out.innerHTML=""; const d=document.createElement("div"); d.className="text-center text-brand-textgray py-10 text-sm"; d.textContent=t; out.appendChild(d); };
  if (!id) return fail("This link is missing its call id.");
  let d;
  try {
    const res = await fetch(API_URL, { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ action:"shared_recording", id }) });
    d = await res.json();
    if (d.error) throw new Error(d.error);
  } catch(e){ return fail("Recording not found — the link may be wrong or the call was removed."); }

  out.innerHTML = "";
  const who = document.createElement("div");
  who.className = "font-serif text-3xl text-brand-black leading-snug flex items-center gap-3";
  who.innerHTML = '<i data-lucide="phone" class="h-5 w-5 text-brand-gold"></i>';
  who.appendChild(document.createTextNode(d.who));
  const meta = document.createElement("div");
  meta.className = "mt-1.5 text-[11px] font-medium uppercase tracking-[0.15em] text-brand-textgray";
  meta.textContent = fmtWhen(d.occurred_at) + fmtDur(d.duration_seconds);
  out.append(who, meta);
  if (d.address){
    const t=document.createElement("div"); t.className="mt-3";
    const s=document.createElement("span");
    s.className="inline-flex items-center gap-1.5 rounded-sm border border-brand-gold/40 bg-brand-cream px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-brand-gold";
    s.innerHTML = '<i data-lucide="home" class="h-3 w-3"></i>';
    s.appendChild(document.createTextNode(d.address));
    t.appendChild(s); out.appendChild(t);
  }
  out.appendChild(buildPlayer(d.recording_url, d.duration_seconds));
  if (d.summary){
    const block=document.createElement("div"); block.className="mt-6 border-t border-brand-warmgray pt-5";
    const eb=document.createElement("div"); eb.className="text-[10px] font-bold uppercase tracking-[0.3em] text-brand-gold mb-2"; eb.textContent="Summary";
    const s=document.createElement("p"); s.className="text-sm leading-relaxed text-brand-charcoal"; s.textContent = d.summary;
    block.append(eb, s); out.appendChild(block);
  }
  icons();
}
boot();
icons();
</script>
</body>
</html>
