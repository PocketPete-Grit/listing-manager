<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Outfit:wght@400;500;600&display=swap");
  :root {
    --bg: #0a0a0a;
    --ink: #f8f6f2;
    --muted: #b7b1a6;
    --gold: #b8986e;
    --serif: "Cormorant Garamond", "Didot", "Hoefler Text", Georgia, serif;
    --sans: "Outfit", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "Menlo", "SF Mono", ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 66px 84px 58px;
    position: relative;
    -webkit-font-smoothing: antialiased;
    border-bottom: 6px solid var(--gold);
  }
  .glow1, .glow2 { position: absolute; inset: 0; pointer-events: none; }
  .glow1 { background: radial-gradient(ellipse at 25% 80%, rgba(184,152,110,0.18) 0%, transparent 50%); }
  .glow2 { background: radial-gradient(ellipse at 88% 8%, rgba(184,152,110,0.13) 0%, transparent 45%); }
  .top { display: flex; align-items: center; gap: 20px; position: relative; }
  .mark {
    width: 58px; height: 58px; flex: none;
    background: var(--gold); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 700; font-size: 34px;
  }
  .wordmark { font-size: 15px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .wordmark .sub { color: var(--muted); font-weight: 400; }
  .mid { position: relative; margin-top: auto; }
  .title { font-family: var(--serif); font-weight: 700; font-size: 108px; line-height: 1; letter-spacing: -1px; }
  .title em { font-style: italic; color: var(--gold); }
  .rule { height: 3px; width: 110px; background: var(--gold); margin: 30px 0 26px; }
  .desc { font-size: 30px; color: var(--muted); max-width: 860px; line-height: 1.35; font-weight: 400; }
  .player {
    position: relative; margin-top: 46px;
    display: flex; align-items: center; gap: 30px;
    border: 1px solid rgba(184,152,110,.35);
    background: rgba(248,246,242,.04);
    padding: 26px 36px; width: 1032px;
  }
  .playbtn {
    width: 84px; height: 84px; flex: none;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
  }
  .playbtn .tri {
    width: 0; height: 0; margin-left: 7px;
    border-top: 21px solid transparent; border-bottom: 21px solid transparent;
    border-left: 32px solid var(--bg);
  }
  .wave { display: flex; align-items: center; gap: 9px; flex: 1; height: 92px; }
  .wave i { display: block; width: 8px; background: var(--gold); }
  .wave i:nth-child(3n+1){ opacity: .45 }
  .wave i:nth-child(3n+2){ opacity: .8 }
  .bottom { position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: 46px; }
  .tag { font-size: 17px; color: var(--muted); letter-spacing: .3em; text-transform: uppercase; font-weight: 500; }
  .sig { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--gold); }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div>
  <div class="top">
    <div class="mark">G</div>
    <div class="wordmark">Pete Grosso Team <span class="sub">· AI Receptionist</span></div>
  </div>

  <div class="mid">
    <div class="title">Call <em>Recording.</em></div>
    <div class="rule"></div>
    <div class="desc">Tap to listen — caller, summary, and full audio on one page.</div>
    <div class="player">
      <div class="playbtn"><div class="tri"></div></div>
      <div class="wave" id="wave"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="tag">Shared by the team</div>
    <div class="sig">RE/MAX Integrity Leaders</div>
  </div>

<script>
  // deterministic pseudo-waveform so the render is stable run to run
  const w = document.getElementById('wave');
  let s = 11;
  for (let i = 0; i < 36; i++) {
    s = (s * 137 + 41) % 97;
    const h = 16 + Math.round((s / 96) * 70);
    const bar = document.createElement('i');
    bar.style.height = h + 'px';
    w.appendChild(bar);
  }
</script>
</body>
</html>
