<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0b2240;
    --bg2: #16406e;
    --ink: #f6f8fa;
    --muted: #9fb3c8;
    --accent: #4b9fff;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "Menlo", "SF Mono", ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: radial-gradient(1200px 630px at 78% 18%, var(--bg2), var(--bg) 62%);
    color: var(--ink);
    font-family: var(--sans);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 80px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .top { display: flex; align-items: center; gap: 18px; }
  .mark {
    width: 58px; height: 58px; border-radius: 16px;
    background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .wordmark { font-weight: 700; font-size: 30px; letter-spacing: .3px; }
  .wordmark .sub { color: var(--muted); font-weight: 500; }
  .mid { margin-top: auto; }
  .title { font-weight: 800; font-size: 82px; line-height: 1.02; letter-spacing: -1.5px; }
  .desc { margin-top: 20px; font-size: 31px; color: var(--muted); max-width: 920px; line-height: 1.3; }
  .player {
    margin-top: 44px; display: flex; align-items: center; gap: 28px;
    background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14);
    border-radius: 24px; padding: 26px 36px; width: 1040px;
  }
  .playbtn {
    width: 86px; height: 86px; border-radius: 50%; flex: none;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .playbtn .tri {
    width: 0; height: 0; margin-left: 8px;
    border-top: 22px solid transparent; border-bottom: 22px solid transparent;
    border-left: 34px solid var(--bg);
  }
  .wave { display: flex; align-items: center; gap: 8px; flex: 1; height: 96px; }
  .wave i { display: block; width: 10px; border-radius: 6px; background: var(--accent); opacity: .95; }
  .wave i:nth-child(4n+1){ opacity: .55 }
  .wave i:nth-child(4n+3){ opacity: .75 }
  .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 44px; }
  .url { font-family: var(--mono); font-size: 23px; color: var(--ink); opacity: .85; }
  .tag { font-size: 22px; color: var(--muted); letter-spacing: 2.5px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="top">
    <div class="mark">📞</div>
    <div class="wordmark">Pete Grosso Team <span class="sub">· AI Receptionist</span></div>
  </div>

  <div class="mid">
    <div class="title">Call Recording</div>
    <div class="desc">Tap to listen — caller, summary, and full audio on one page.</div>
    <div class="player">
      <div class="playbtn"><div class="tri"></div></div>
      <div class="wave" id="wave"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="tag">Shared by the team</div>
    <div class="url">pete grosso · re/max integrity leaders</div>
  </div>

<script>
  // deterministic pseudo-waveform so the render is stable run to run
  const w = document.getElementById('wave');
  let s = 7;
  for (let i = 0; i < 38; i++) {
    s = (s * 137 + 41) % 97;
    const h = 18 + Math.round((s / 96) * 74);
    const bar = document.createElement('i');
    bar.style.height = h + 'px';
    w.appendChild(bar);
  }
</script>
</body>
</html>
