<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Activity — Pete Grosso Team</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: { black:'#0a0a0a', white:'#ffffff', cream:'#f8f6f2', warmgray:'#e8e4dd', gold:'#b8986e', goldlight:'#d4bc96', charcoal:'#2a2a2a', textgray:'#4a4a4a' } },
  fontFamily: { sans:['Outfit','sans-serif'], serif:['Cormorant Garamond','serif'] }
}}};
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{font-family:'Outfit',sans-serif}
input,select{padding:.6rem .9rem;border:1px solid #e8e4dd;border-radius:0;background:#fff;color:#0a0a0a;font:inherit;font-size:14px}
input::placeholder{color:rgba(74,74,74,.4)}
input:focus,select:focus{outline:none;border-color:#b8986e;box-shadow:0 0 0 1px #b8986e}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#2a2a2a;margin-bottom:.35rem}
.btn-sweep{position:relative;z-index:0;overflow:hidden;background:#0a0a0a;color:#fff;border:0;border-radius:0;padding:.8rem 1.6rem;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:color .3s,transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn-sweep::before{content:"";position:absolute;inset:0;width:0;background:#b8986e;transition:width .3s ease-out;z-index:-1}
.btn-sweep:hover::before{width:100%}
.btn-sweep:hover{color:#0a0a0a}
.btn-sweep:active{transform:scale(.98)}
.btn-sweep:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid rgba(184,152,110,.35);color:#b8986e;border-radius:0;padding:.8rem 1.6rem;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.btn-outline:hover{border-color:#b8986e;background:rgba(184,152,110,.1)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-small{background:transparent;border:1px solid #e8e4dd;color:#2a2a2a;border-radius:0;padding:.45rem .9rem;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:.4rem}
.btn-small:hover{border-color:#b8986e;color:#b8986e}
.btn-small:active{transform:scale(.98)}
.card{background:#fff;border:1px solid #e8e4dd;border-radius:0;padding:1.4rem 1.5rem;margin-bottom:.9rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pillrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.pill{border:1px solid #e8e4dd;background:#fff;border-radius:9999px;padding:.4rem 1.1rem;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:#4a4a4a;transition:all .3s;display:inline-flex;align-items:center;gap:.4rem}
.pill:hover{border-color:#b8986e;color:#b8986e}
.pill.on{background:#b8986e;border-color:#b8986e;color:#0a0a0a}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:2px;border:1px solid #e8e4dd;background:#fff;padding:.15rem .6rem;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#4a4a4a;margin-left:.5rem;vertical-align:2px}
.chip.flag{border-color:#f43f5e;background:#fff1f2;color:#e11d48}
.chip.listing{border-color:rgba(184,152,110,.4);background:#f8f6f2;color:#b8986e;cursor:pointer}
.chip.listing:hover{border-color:#b8986e}
details{margin-top:.8rem}
summary{cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#b8986e}
summary:hover{color:#d4bc96}
pre{white-space:pre-wrap;font-size:12.5px;line-height:1.6;background:#f8f6f2;border-left:2px solid #e8e4dd;padding:.9rem 1rem;margin:.5rem 0 0;font-family:Menlo,'SF Mono',ui-monospace,monospace}
.player{display:flex;align-items:center;gap:.9rem;margin-top:.9rem;border:1px solid #e8e4dd;background:#f8f6f2;padding:.7rem .9rem}
.playbtn{width:38px;height:38px;flex:none;border:0;border-radius:0;background:#0a0a0a;color:#b8986e;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s}
.playbtn:hover{background:#b8986e;color:#0a0a0a}
.playbtn:active{transform:scale(.98)}
.ptrack{flex:1;height:3px;background:#e8e4dd;cursor:pointer;position:relative}
.pfill{height:100%;width:0;background:#b8986e;transition:width .15s linear}
.ptime{font-size:11px;letter-spacing:.08em;color:#4a4a4a;font-variant-numeric:tabular-nums;flex:none}
#msg{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#0a0a0a;color:#f8f6f2;border-left:3px solid #b8986e;padding:.85rem 1.4rem;font-size:12px;font-weight:500;letter-spacing:.08em;display:none;z-index:50;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:90vw}
.empty{color:#4a4a4a;text-align:center;padding:3rem 0;font-size:14px}
</style>
</head>
<body class="bg-brand-cream text-brand-charcoal font-sans antialiased">
<div class="max-w-[880px] mx-auto px-4 pt-10 pb-16">

  <div class="mb-7 border-b border-brand-warmgray pb-6">
    <a href="index.html" class="group inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-brand-gold hover:text-brand-goldlight transition-colors duration-200 mb-4">
      <i data-lucide="arrow-left" class="h-3.5 w-3.5 transition-transform duration-200 ease-out group-hover:-translate-x-1"></i> Listing Manager
    </a>
    <div class="flex items-center gap-3 mb-3">
      <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-brand-gold">Pete Grosso Team · AI Receptionist</span>
      <span class="h-px w-10 bg-brand-gold"></span>
    </div>
    <h1 class="font-serif text-5xl text-brand-black leading-tight">Every call, <em class="text-brand-gold">kept.</em></h1>
    <p class="mt-3 text-sm text-brand-textgray">Every call and text the receptionist has handled — transcripts, recordings, and feedback.</p>
  </div>

  <div id="login" class="card" style="display:none">
    <label for="pw">Password</label>
    <input id="pw" type="password" style="width:100%">
    <div class="mt-5 flex flex-wrap gap-3">
      <button class="btn-sweep" id="loginbtn">Sign in</button>
      <button class="btn-outline" id="forgotbtn">Forgot password? Text me</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="flex gap-2 flex-wrap items-center">
      <div class="relative flex-1 min-w-[180px]">
        <i data-lucide="search" class="h-4 w-4 text-brand-gold absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="q" placeholder="Search what was said…" style="width:100%;padding-left:2.6rem">
      </div>
      <select id="listing"><option value="">All listings</option></select>
      <select id="days">
        <option value="">All time</option>
        <option value="1">Today</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </div>
    <div class="pillrow" id="chips">
      <span class="pill on" data-k="">All</span>
      <span class="pill" data-k="call">Calls</span>
      <span class="pill" data-k="sms">Texts</span>
      <span class="pill" data-k="feedback">Feedback</span>
      <span class="pill" data-k="flagged">Flagged</span>
    </div>
    <div id="feed"></div>
    <div class="text-center mt-6 mb-10">
      <button class="btn-outline" id="more" style="display:none">Load more</button>
    </div>
  </div>
  <div id="msg"></div>
</div>

<script>
"use strict";
const API_URL = "https://wxntrwlalvhwsueqbiys.supabase.co/functions/v1/listing-admin";
const PLAY_URL = "https://pocketpete-grit.github.io/listing-manager/play.html";
let PW = localStorage.getItem("la_pw") || "";
let kind = "", offset = 0;
const PAGE = 50;

const $ = (id) => document.getElementById(id);
function show(id){ ["login","app"].forEach(x => $(x).style.display = (x===id ? "" : "none")); }
function toast(t){ const m=$("msg"); m.textContent=t; m.style.display="block"; setTimeout(()=>m.style.display="none",2600); }
function icons(){ if (window.lucide) lucide.createIcons(); }

async function api(action, extra){
  const res = await fetch(API_URL, { method:"POST", headers:{ "content-type":"application/json" },
    body: JSON.stringify(Object.assign({action, password:PW}, extra||{})) });
  if (res.status===401){ PW=""; localStorage.removeItem("la_pw"); show("login"); throw new Error("Wrong password"); }
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  return d;
}

function fmtWhen(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " " +
         d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}
function fmtDur(s){ if(!s) return ""; return ` · ${Math.floor(s/60)}m ${s%60}s`; }
function fmtClock(s){ s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function iconName(a){
  if (a.metadata && a.metadata.feedback) return "clipboard-list";
  if (a.type === "call") return "phone";
  return a.direction === "outbound" ? "bot" : "message-square";
}
function whoLine(a){
  const from = (a.metadata && a.metadata.from) || (a.subject||"").replace("AI call — ","");
  if (a.type === "sms" && a.direction === "outbound") return "Riley replied";
  return from || "(unknown)";
}

// One shared custom player — only one recording plays at a time.
let currentAudio = null;
function buildPlayer(url, durationSec){
  const wrap = document.createElement("div"); wrap.className = "player";
  const btn = document.createElement("button"); btn.className = "playbtn"; btn.setAttribute("aria-label","Play recording");
  btn.innerHTML = '<i data-lucide="play" class="h-4 w-4"></i>';
  const track = document.createElement("div"); track.className = "ptrack";
  const fill = document.createElement("div"); fill.className = "pfill"; track.appendChild(fill);
  const time = document.createElement("span"); time.className = "ptime";
  time.textContent = "0:00 / " + fmtClock(durationSec);
  const au = new Audio(); au.preload = "none"; au.src = url;
  const setBtn = (playing) => {
    btn.innerHTML = playing ? '<i data-lucide="pause" class="h-4 w-4"></i>' : '<i data-lucide="play" class="h-4 w-4"></i>';
    icons();
  };
  btn.onclick = () => {
    if (au.paused){
      if (currentAudio && currentAudio !== au) currentAudio.pause();
      currentAudio = au; au.play();
    } else au.pause();
  };
  au.onplay = () => setBtn(true);
  au.onpause = () => setBtn(false);
  au.onended = () => { setBtn(false); fill.style.width = "0"; au.currentTime = 0; };
  au.ontimeupdate = () => {
    const total = au.duration || durationSec || 0;
    if (total) fill.style.width = (au.currentTime / total * 100) + "%";
    time.textContent = fmtClock(au.currentTime) + " / " + fmtClock(au.duration || durationSec);
  };
  track.onclick = (e) => {
    const total = au.duration || durationSec || 0;
    if (!total) return;
    const r = track.getBoundingClientRect();
    au.currentTime = ((e.clientX - r.left) / r.width) * total;
    if (au.paused) btn.onclick();
  };
  wrap.append(btn, track, time);
  return wrap;
}

function card(a){
  const c = document.createElement("div");
  c.className = "card group transition-all duration-300 ease-out hover:shadow-[0_10px_40px_rgba(0,0,0,0.06)] hover:border-brand-gold/40";
  const top = document.createElement("div");
  const who = document.createElement("span");
  who.className = "font-serif text-xl text-brand-black inline-flex items-center gap-2";
  who.innerHTML = '<i data-lucide="' + iconName(a) + '" class="h-4 w-4 text-brand-gold"></i>';
  who.appendChild(document.createTextNode(whoLine(a)));
  top.appendChild(who);
  const flagged = a.metadata && (a.metadata.flagged===true || a.metadata.handoff===true || a.metadata.successful===false);
  if (flagged){ const t=document.createElement("span"); t.className="chip flag"; t.textContent="flagged"; top.appendChild(t); }
  if (a.metadata && a.metadata.sentiment){ const t=document.createElement("span"); t.className="chip"; t.textContent=a.metadata.sentiment; top.appendChild(t); }
  const prop = a.properties;
  if (prop && prop.address_line1){
    const t=document.createElement("span"); t.className="chip listing"; t.textContent=prop.address_line1;
    t.onclick = () => { $("listing").value = a.property_id; reload(); };
    top.appendChild(t);
  }
  c.appendChild(top);

  const meta = document.createElement("div");
  meta.className = "mt-1 text-[11px] font-medium uppercase tracking-[0.15em] text-brand-textgray";
  meta.textContent = fmtWhen(a.occurred_at) + fmtDur(a.duration_seconds);
  c.appendChild(meta);

  const body = document.createElement("div");
  body.className = "mt-3 text-sm leading-relaxed text-brand-charcoal";
  body.textContent = a.content || "(no content)";
  c.appendChild(body);

  if (a.metadata && a.metadata.recording_url){
    c.appendChild(buildPlayer(a.metadata.recording_url, a.duration_seconds));
  }
  if (a.metadata && a.metadata.transcript){
    const det = document.createElement("details");
    const sum = document.createElement("summary"); sum.textContent = "Full transcript";
    const pre = document.createElement("pre"); pre.textContent = a.metadata.transcript;
    det.append(sum, pre); c.appendChild(det);
  }

  // --- forward this message (transcript summary + recording link) to a teammate ---
  if (a.id && a.type !== "note"){
    const hasRec = !!(a.metadata && a.metadata.recording_url);
    const fwdWrap = document.createElement("div"); fwdWrap.className = "mt-4 flex gap-2 flex-wrap items-center";
    const fwdBtn = document.createElement("button");
    fwdBtn.className = "btn-small";
    fwdBtn.innerHTML = '<i data-lucide="corner-up-right" class="h-3.5 w-3.5"></i>';
    fwdBtn.appendChild(document.createTextNode(hasRec ? "Forward (incl. recording)" : "Forward"));
    const panel = document.createElement("div"); panel.style.display = "none"; panel.className = "w-full mt-2 border-t border-brand-warmgray/60 pt-3";
    const prow = document.createElement("div"); prow.className = "flex gap-2 flex-wrap items-center";
    const sel = document.createElement("select");
    [["pete","Me (Pete)"],["jaime","Jaime"],["katie","Katie / front desk"],["custom","Custom number…"]]
      .forEach(([v,l]) => { const o=document.createElement("option"); o.value=v; o.textContent=l; sel.appendChild(o); });
    const custom = document.createElement("input");
    custom.placeholder = "Phone number"; custom.inputMode = "tel";
    custom.style.display = "none"; custom.style.width = "150px";
    sel.onchange = () => { custom.style.display = sel.value === "custom" ? "" : "none"; };
    const sendB = document.createElement("button");
    sendB.className = "btn-sweep"; sendB.style.padding = ".55rem 1.2rem";
    sendB.textContent = "Send";
    prow.append(sel, custom, sendB);
    const note = document.createElement("input");
    note.placeholder = "Add a note (optional)"; note.style.width = "100%"; note.style.marginTop = ".5rem";
    panel.append(prow, note);
    fwdBtn.onclick = () => { panel.style.display = panel.style.display === "none" ? "" : "none"; };
    sendB.onclick = async () => {
      const to = sel.value === "custom" ? custom.value.trim() : sel.value;
      if (!to){ toast("Pick a teammate or enter a number"); return; }
      sendB.disabled = true; sendB.textContent = "Sending…";
      try {
        const r = await api("forward_message", { activity_id: a.id, to, note: note.value.trim() });
        toast("Sent to " + (r.to || "team")); panel.style.display = "none"; note.value = "";
      } catch(e){ toast(e.message); }
      finally { sendB.disabled = false; sendB.textContent = "Send"; }
    };
    if (hasRec){
      const shareBtn = document.createElement("button");
      shareBtn.className = "btn-small";
      shareBtn.innerHTML = '<i data-lucide="link" class="h-3.5 w-3.5"></i>';
      shareBtn.appendChild(document.createTextNode("Copy share link"));
      shareBtn.onclick = async () => {
        const link = PLAY_URL + "?c=" + a.id;
        try { await navigator.clipboard.writeText(link); toast("Link copied — paste it in a text"); }
        catch { prompt("Copy this link:", link); }
      };
      fwdWrap.append(fwdBtn, shareBtn, panel);
    } else {
      fwdWrap.append(fwdBtn, panel);
    }
    c.appendChild(fwdWrap);
  }
  return c;
}

async function load(append){
  try {
    const d = await api("activity_list", {
      kind: kind || undefined,
      listing_id: $("listing").value || undefined,
      days: $("days").value || undefined,
      q: $("q").value.trim() || undefined,
      limit: PAGE, offset,
    });
    const feed = $("feed");
    if (!append) feed.textContent = "";
    if (!d.rows.length && !append){
      const e=document.createElement("div"); e.className="empty";
      e.textContent="Nothing here yet — activity appears as calls and texts come in.";
      feed.appendChild(e);
    }
    for (const a of d.rows) feed.appendChild(card(a));
    $("more").style.display = d.rows.length === PAGE ? "" : "none";
    icons();
  } catch(e){ toast(e.message); }
}
function reload(){ offset = 0; load(false); }

async function boot(){
  show("app");
  try {
    const d = await api("list");
    for (const r of d.rows){
      const o=document.createElement("option"); o.value=r.id;
      o.textContent=r.address_line1 + (r.city ? ", "+r.city : "");
      $("listing").appendChild(o);
    }
  } catch(e){ /* listing dropdown is optional */ }
  const params = new URLSearchParams(location.search);
  if (params.get("listing")) $("listing").value = params.get("listing");
  reload();
}

$("loginbtn").onclick = ()=>{ PW=$("pw").value.trim(); localStorage.setItem("la_pw",PW); boot(); };
$("forgotbtn").onclick = async ()=>{
  const b=$("forgotbtn"); b.disabled=true; b.textContent="Sending…";
  try {
    const res = await fetch(API_URL, { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ action:"forgot_password" }) });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    toast("Texted to Pete's cell");
  } catch(e){ toast(e.message); }
  finally { b.disabled=false; b.textContent="Forgot password? Text me"; }
};
$("pw") && $("pw").addEventListener("keydown",(e)=>{ if(e.key==="Enter") $("loginbtn").click(); });
document.querySelectorAll(".pill").forEach((ch)=>{ ch.onclick=()=>{
  document.querySelectorAll(".pill").forEach((x)=>x.classList.remove("on"));
  ch.classList.add("on"); kind = ch.dataset.k; reload();
};});
let qt; $("q").addEventListener("input", ()=>{ clearTimeout(qt); qt=setTimeout(reload, 400); });
$("listing").onchange = reload;
$("days").onchange = reload;
$("more").onclick = ()=>{ offset += PAGE; load(true); };

if (PW) boot(); else show("login");
icons();
</script>
</body>
</html>
